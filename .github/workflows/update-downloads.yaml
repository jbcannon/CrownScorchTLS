name: Update downloads figure

on:
  schedule:
    - cron: '0 6 * * 1'  # every Monday at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-figure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Kept intentionally minimal: dev.R only needs these three, not the
      # full package (which would pull in lidR and friends).
      - name: Install R dependencies
        run: Rscript -e 'install.packages(c("jsonlite", "dplyr", "ggplot2"))'

      - name: Regenerate downloads figure
        run: Rscript dev.R

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add man/figures/downloads.png
          if git diff --cached --quiet; then
            echo "Figure unchanged"
          else
            git commit -m "Update downloads figure [skip ci]"
            git push
          fi
