name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: macos-latest, r: 'release'}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      - uses: r-lib/actions/setup-pandoc@v2

       # 🔧 macOS-only: force source installs (avoid missing CRAN binaries)
      - name: Disable pak binary installs on macOS
        if: runner.os == 'macOS'
        run: |
          echo "PAK_BUILD_BINARY=false" >> $GITHUB_ENV

      # 🔧 macOS-only: system libraries needed by wk / sf / friends
      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: |
          brew install geos proj sqlite


      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
